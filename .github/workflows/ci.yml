name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ri, POSTGRES_PASSWORD: ri, POSTGRES_DB: ri }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ri" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/constraints.txt }
      - name: Install (without torch; TF-IDF embeddings in CI)
        run: |
          grep -viE '^(torch|sentence|transformers|tokenizers|safetensors|huggingface|nvidia)' constraints.txt > c2.txt
          pip install -c c2.txt ".[dev]"
      - name: Lint
        run: ruff check app eval tests
      - name: Unit + API tests (SQLite)
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - name: Migrations apply cleanly on PostgreSQL and match models
        env: { DATABASE_URL: "postgresql+psycopg://ri:ri@localhost:5432/ri" }
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests against PostgreSQL
        env: { TEST_DATABASE_URL: "postgresql+psycopg://ri:ri@localhost:5432/ri" }
        run: pytest -x -q tests/test_isolation.py tests/test_ai_editor.py tests/test_jobs_exports_account.py
      - name: Synthetic evaluation (report artifact)
        run: python -m eval.run_eval --split all --embedding tfidf
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: backend/eval/reports/ }
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r c2.txt --strict || (echo "::warning::pip-audit reported vulnerabilities" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t ri-backend:ci --build-arg INSTALL_ML=false backend
          docker build -t ri-frontend:ci frontend
      - name: Scan images (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "ri-backend:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "ri-frontend:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - name: Validate compose files
        run: |
          docker compose config -q
          # production file with the template and placeholder secrets (the real values live in deploy/.env)
          POSTGRES_PASSWORD=ci REDIS_PASSWORD=ci S3_SECRET_ACCESS_KEY=ci APP_ENV_FILE=env.production.example \
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/env.production.example config -q
