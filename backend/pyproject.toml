[project]
name = "resume-intelligence-backend"
version = "0.1.0"
description = "AI Resume Intelligence and Career Assistant — API and workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "celery>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "sentry-sdk>=2.5",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "cryptography>=42",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Sentence Transformers pulls in PyTorch (~700MB). Install for production-quality
# semantic matching; without it the TF-IDF fallback embedder is used and recorded.
ml = ["sentence-transformers>=3.0"]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pymupdf>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"eval/*" = ["S"]
